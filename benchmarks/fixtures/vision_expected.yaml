# Vision benchmark — expected register values to extract from register_map.png.
#
# The test image should be a screenshot of the SX1276 register map showing:
# - RegPaConfig at address 0x09 with default 0x4F
# - RegLna at address 0x0C with default 0x20
# - RegModemConfig1 at address 0x1D with default 0x72
#
# Replace register_map.png with an actual datasheet screenshot.
# A placeholder is generated by benchmarks/fixtures/generate_test_image.py.

prompt: |
  This is a register map from the SX1276 LoRa transceiver datasheet.
  Extract the following information:
  1. The default value of the register at address 0x09
  2. The default value of the register at address 0x0C
  3. The default value of the register at address 0x1D

expected_values:
  - name: "RegPaConfig (0x09)"
    patterns:
      - "0x4F"
      - "4F"
      - "0x4f"

  - name: "RegLna (0x0C)"
    patterns:
      - "0x20"
      - "20"
      - "32"

  - name: "RegModemConfig1 (0x1D)"
    patterns:
      - "0x72"
      - "72"
      - "114"
