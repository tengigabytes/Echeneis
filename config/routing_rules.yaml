tiers:
  S:
    description: Deep reasoning, complex code review
    trigger:
      - command: /think
      - classifier: high_complexity
    models:
      reasoning: gemma-4-31b
    fallback:
      - nvidia-nemotron-3-ultra-550b  # NVIDIA NIM flagship (40 RPM, no credit cap)
      - gemini-3.5-flash
      - nvidia-nemotron-3-super-120b
      - github-gpt-4o

  A:
    description: General purpose - translation, Q&A, code generation
    trigger:
      - default: true
    models:
      translation: gemma-4-31b          # 6/6 term preservation
      code_generation: gemma-4-31b       # dense -deep attention for code
      code_review: gemma-4-31b           # dense -focused analysis
      general_qa: gemma-4-31b
      vision: gemma-4-31b               # dense -better image understanding
    # Fallback chains ordered for provider diversity:
    # each task's chain intentionally spans multiple providers so that a
    # single provider's outage never breaks the entire task.
    fallback:
      translation:
        - nvidia-nemotron-3-super-120b   # NVIDIA NIM
        - gemini-3.5-flash
        - groq-gpt-oss-120b
      code_generation:
        - mistral-codestral              # Mistral code specialist, ~0.5s
        - nvidia-nemotron-3-super-120b
        - groq-gpt-oss-120b
      code_review:
        - nvidia-nemotron-3-super-120b
        - gemini-3.5-flash
        - groq-gpt-oss-120b
      general_qa:
        # Translation-ish prompts that miss the translation keyword list
        # (e.g. "轉成英文") land here, so the chain leads with the largest
        # models and keeps the small ones last.
        - groq-gpt-oss-120b              # ~0.4s
        - nvidia-nemotron-3-super-120b
        - gemini-3.5-flash
        - gemini-3.5-flash-lite          # last resort: fast but small
      vision:
        - gemini-3.1-flash-lite          # ~1s, multimodal, A-tier quality
        - gemma-4-26b

  B:
    description: Batch processing, format conversion, simple summarization
    trigger:
      - command: /fast
      - classifier: low_complexity
      - batch_api: true
    models:
      batch: groq-gpt-oss-120b
      summarization: gemma-4-26b         # MoE -good throughput for summaries
    fallback:
      batch:
        - gemini-3.5-flash-lite
        - groq-gpt-oss-20b
      summarization:
        - groq-gpt-oss-120b
        - gemini-3.5-flash-lite

task_types:
  - name: translation
    keywords:
      - translate
      - translation
      - 翻譯
      - 翻成
      - 翻一下
      - 幫我翻
      - 英譯
      - 中譯
      - 日譯
      - 譯成
      - in english
      - in chinese
      - in japanese
      - to english
      - to chinese
      - to japanese
    default_tier: A
  - name: code_generation
    keywords: [code, implement, function, class, debug, test, lint, refactor]
    default_tier: A
  - name: code_review
    keywords: [review, audit, analyze code]
    default_tier: A
  - name: summarization
    keywords: [summarize, summary, tldr, 摘要]
    default_tier: B
  - name: reasoning
    keywords: [think, reason, explain why, analyze]
    default_tier: S
  - name: vision
    keywords: []
    detect: image_attachment
    default_tier: A
  - name: batch
    keywords: [format, convert, transform, label, classify, tag, annotate]
    default_tier: B

failover:
  on_429: switch_to_fallback
  on_5xx:
    action: mark_unhealthy
    retry_after_seconds: 60
  on_timeout:
    timeout_seconds: 120
    action: switch_to_fallback
  circuit_breaker:
    consecutive_failures: 3
    open_duration_seconds: 300
    half_open_test: true

cross_check:
  enabled: false
  verify_model: mistral-large-latest
  trigger: natural_language_output
