tiers:
  S:
    description: Deep reasoning, complex code review
    trigger:
      - command: /think
      - classifier: high_complexity
    models:
      reasoning: gemma-4-31b
    fallback:
      - nvidia-mistral-large-3       # NVIDIA NIM 675B flagship (S-tier quality)
      - nvidia-nemotron-super-49b    # NVIDIA NIM (40 RPM, no credit cap)
      - gemini-2.5-flash
      - github-gpt-4o

  A:
    description: General purpose - translation, Q&A, code generation
    trigger:
      - default: true
    models:
      translation: mistral-large-3      # ~1.2s p50, 6/6 term preservation
      code_generation: gemma-4-31b       # dense -deep attention for code
      code_review: gemma-4-31b           # dense -focused analysis
      general_qa: gemma-4-31b
      vision: gemma-4-31b               # dense -better image understanding
    # Fallback chains ordered for provider diversity:
    # each task's chain intentionally spans multiple providers so that a
    # single provider's outage never breaks the entire task.
    fallback:
      translation:
        - nvidia-devstral-123b   # NVIDIA -Mistral family, diff endpoint
        - gemma-4-31b                    # Google AI Studio
        - nvidia-gemma-3-27b             # NVIDIA -Google variant
      code_generation:
        - mistral-large-3
        - nvidia-nemotron-super-49b  # NVIDIA -A-tier reasoning
        - nvidia-gemma-3-27b
      code_review:
        - mistral-large-3
        - nvidia-devstral-123b        # NVIDIA -coding specialist 123B
        - nvidia-nemotron-super-49b
        - nvidia-gemma-3-27b
      general_qa:
        - cerebras-llama-8b
        - nvidia-llama-4-maverick     # 17B×128E MoE, ~0.4s
        - nvidia-mistral-nemotron     # NVIDIA-tuned Mistral, fast + diverse
        - nvidia-nemotron-super-49b
        - groq-llama-70b
      vision:
        - nvidia-gemma-3-27b             # NVIDIA vision backup
        - gemini-2.5-flash
        - gemma-4-26b

  B:
    description: Batch processing, format conversion, simple summarization
    trigger:
      - command: /fast
      - classifier: low_complexity
      - batch_api: true
    models:
      batch: groq-llama-70b
      summarization: gemma-4-26b         # MoE -good throughput for summaries
    fallback:
      batch:
        - cerebras-llama-8b
        - groq-llama-4-scout
      summarization:
        - groq-llama-70b
        - nvidia-gemma-3-27b

task_types:
  - name: translation
    keywords:
      - translate
      - translation
      - 翻譯
      - 翻成
      - 翻一下
      - 幫我翻
      - 英譯
      - 中譯
      - 日譯
      - 譯成
      - in english
      - in chinese
      - in japanese
      - to english
      - to chinese
      - to japanese
    default_tier: A
  - name: code_generation
    keywords: [code, implement, function, class, debug, test, lint, refactor]
    default_tier: A
  - name: code_review
    keywords: [review, audit, analyze code]
    default_tier: A
  - name: summarization
    keywords: [summarize, summary, tldr, 摘要]
    default_tier: B
  - name: reasoning
    keywords: [think, reason, explain why, analyze]
    default_tier: S
  - name: vision
    keywords: []
    detect: image_attachment
    default_tier: A
  - name: batch
    keywords: [format, convert, transform, label, classify, tag, annotate]
    default_tier: B

failover:
  on_429: switch_to_fallback
  on_5xx:
    action: mark_unhealthy
    retry_after_seconds: 60
  on_timeout:
    timeout_seconds: 120
    action: switch_to_fallback
  circuit_breaker:
    consecutive_failures: 3
    open_duration_seconds: 300
    half_open_test: true

cross_check:
  enabled: false
  verify_model: mistral-large-latest
  trigger: natural_language_output
