model_list:
  # --- Google AI Studio ---
  - model_name: gemma-4-31b
    litellm_params:
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GOOGLE_AI_STUDIO_API_KEY
    rate_limits:
      rpm: 15
      rpd: 1500

  - model_name: gemma-4-26b
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GOOGLE_AI_STUDIO_API_KEY
    rate_limits:
      rpm: 15
      rpd: 1500

  # --- Mistral ---
  # Only Codestral is reachable on this account tier; the general chat
  # models (large/small/medium) return tier_not_allowed or a 0 RPM limit.
  - model_name: mistral-codestral
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
    rate_limits:
      rpm: 60
      rpd: 0  # token-limited per minute, not RPD-limited

  # --- Groq ---
  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
    rate_limits:
      rpm: 30
      rpd: 1000  # also capped at 8K tokens/min

  - model_name: groq-gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
    rate_limits:
      rpm: 30
      rpd: 1000  # also capped at 8K tokens/min

  # --- Cloudflare Workers AI ---
  - model_name: cf-llama-3-70b
    litellm_params:
      model: cloudflare/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_key: os.environ/CLOUDFLARE_API_TOKEN
      api_base: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai
    rate_limits:
      rpm: 300
      rpd: 500

  # --- GitHub Models ---
  - model_name: github-gpt-4o
    litellm_params:
      model: github/gpt-4o
      api_key: os.environ/GITHUB_TOKEN
    rate_limits:
      rpm: 15
      rpd: 150

  # --- NVIDIA NIM (build.nvidia.com, rate-limit-based trial, no credit cap) ---
  - model_name: nvidia-nemotron-3-super-120b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY
    rate_limits:
      rpm: 40
      rpd: 0  # no published daily cap

  - model_name: nvidia-nemotron-3-ultra-550b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
    rate_limits:
      rpm: 40
      rpd: 0

  # --- Gemini API ---
  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GOOGLE_AI_STUDIO_API_KEY
    rate_limits:
      rpm: 15
      rpd: 500

  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_AI_STUDIO_API_KEY
    rate_limits:
      rpm: 15
      rpd: 500

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GOOGLE_AI_STUDIO_API_KEY
    rate_limits:
      rpm: 10
      rpd: 250

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 120
