services:
  gateway:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "4000:4000"
    volumes:
      - ./config:/app/config
      - /var/lib/echeneis/state:/app/state
    env_file:
      - .env
    environment:
      - ECHENEIS_CONFIG_DIR=/app/config
      - ECHENEIS_STATE_DIR=/app/state
      - TZ=Asia/Taipei
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["python", "-m", "echeneis.bot.main"]
    env_file:
      - .env
    environment:
      - ECHENEIS_GATEWAY_URL=http://gateway:4000
      - ECHENEIS_STATE_DIR=/app/state
      - TZ=Asia/Taipei
    volumes:
      - /var/lib/echeneis/state:/app/state
      - /proc:/host/proc:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
