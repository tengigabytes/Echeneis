services:
  gateway:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - ECHENEIS_CONFIG_DIR=/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
