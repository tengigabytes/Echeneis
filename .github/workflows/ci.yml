name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest

  config-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate routing_rules.yaml
        run: |
          python - <<'PY'
          import yaml
          with open("config/routing_rules.yaml", encoding="utf-8") as f:
              data = yaml.safe_load(f)
          assert isinstance(data, dict), "top-level must be a mapping"
          assert "tiers" in data, "missing 'tiers' key"
          for name, tier in data["tiers"].items():
              assert "models" in tier, f"tier {name} missing 'models'"
              assert isinstance(tier["models"], dict), f"tier {name} 'models' must be a mapping"
          print(f"routing_rules.yaml OK ({len(data['tiers'])} tiers)")
          PY
      - name: Validate litellm_config.yaml
        run: |
          python - <<'PY'
          import yaml
          with open("config/litellm_config.yaml", encoding="utf-8") as f:
              data = yaml.safe_load(f)
          assert isinstance(data, dict), "top-level must be a mapping"
          assert "model_list" in data, "missing 'model_list' key"
          assert isinstance(data["model_list"], list), "'model_list' must be a list"
          for entry in data["model_list"]:
              assert "model_name" in entry, f"entry missing model_name: {entry}"
              assert "litellm_params" in entry, f"entry missing litellm_params: {entry['model_name']}"
          print(f"litellm_config.yaml OK ({len(data['model_list'])} models)")
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
