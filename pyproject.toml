[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echeneis"
version = "0.1.0"
description = "Unified AI gateway for multi-provider free-tier aggregation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "tengigabytes" },
]
dependencies = [
    "litellm>=1.40.0",
    "python-telegram-bot>=21.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.0",
    "isort>=5.13.0",
]

[project.scripts]
ech-bot = "echeneis.bot.main:main"
ech-mcp = "echeneis.mcp.delegate:main"
ech-bench = "benchmarks.cli:main"

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "benchmark: integration benchmarks against live gateway",
    "latency: latency measurement benchmark",
    "context_recall: long context recall benchmark",
    "vision: vision capability benchmark",
    "code_review: embedded C code review benchmark",
    "translation: translation consistency benchmark",
    "rate_limit: rate limit stress test",
    "multi_turn: multi-turn conversation benchmark",
]
